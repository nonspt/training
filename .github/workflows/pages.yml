name: 发布训练跟练

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v6
      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 安装锁定的包管理器
        run: npm install --global pnpm@11.25.0
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 验证训练规则与动作库
        run: pnpm test
      - name: 构建正式版
        run: pnpm build
        env:
          APP_BASE: /training/
      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
